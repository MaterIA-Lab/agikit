[project]
name = "agikit"
version = "0.1.0"
description = "CLI toolkit for scaffolding .agi agent projects"
readme = "README.md"
authors = [
    { name = "SamthinkGit", email = "sebastianmayorquin@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.2",
    "rich>=14.0.0",
]

[project.scripts]
agikit = "agikit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agikit"]

[tool.uv.workspace]
members = [
    "test-agent/tools/test-tool",
    "test-agent/tools/exa-mcp",
    "lab/my-agent/tools/minecraft-tools",
    "lab/my-agent/tools/test-tool",
]
