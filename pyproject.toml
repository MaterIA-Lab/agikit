[project]
name = "agikit"
version = "0.1.0"
description = "CLI toolkit for scaffolding .agi agent projects"
readme = "README.md"
authors = [
    { name = "SamthinkGit", email = "sebastianmayorquin@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "rich>=14.0.0",
]

[project.scripts]
agikit = "agikit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agikit"]
